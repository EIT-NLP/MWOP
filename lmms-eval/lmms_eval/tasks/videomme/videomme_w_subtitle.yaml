dataset_path: lmms-lab/Video-MME
dataset_kwargs:
  cache_dir: videomme
  video: true
task: videomme_w_subtitle
test_split: test
output_type: generate_until
doc_to_visual: !function 'utils.videomme_doc_to_visual'
doc_to_text: !function 'utils.videomme_doc_to_text_subtitle'
doc_to_target: answer
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function 'utils.videomme_process_results'
metric_list:
- metric: videomme_perception_score
  aggregation: !function 'utils.videomme_aggregate_results'
  higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    frame_num: 32
    pre_prompt: ''
    post_prompt: '

      Answer the question using a single word or phrase.'
  llava_vid:
    frame_num: 768
    pre_prompt: ''
    post_prompt: '

      Answer the question using a single word or phrase.'
metadata:
- version: 0.0
