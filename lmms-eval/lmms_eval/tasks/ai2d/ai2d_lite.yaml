dataset_path: lmms-lab/LMMs-Eval-Lite
task: ai2d_lite
dataset_kwargs:
dataset_name: ai2d
test_split: lite
output_type: generate_until
doc_to_visual: !function 'utils.ai2d_doc_to_visual'
doc_to_text: !function 'utils.ai2d_doc_to_text'
doc_to_target: !function 'utils.ai2d_doc_to_target'
lmms_eval_specific_kwargs:
  default:
    prompt_format: mcq
    pre_prompt: ''
    post_prompt: '

      Answer with the option''s letter from the given choices directly.'
model_specific_target_kwargs:
  default: mcq
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  do_sample: false
filter_list:
- name: flexible-extract
  filter:
  - function: !function 'utils.MultiChoiceRegexFilter'
    group_select: 0
    ignore_case: true
    ignore_punctuation: true
    regex_pattern: ([A-Z])\.
metric_list:
- metric: exact_match
  aggregation: mean
  higher_is_better: true
  ignore_case: true
  ignore_punctuation: true
metadata:
- version: 0.0
