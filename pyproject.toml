[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mwop"
version = "0.1.0"
description = "Modality-aware Width-wise Operation Pruning for LLaVA-OneVision-7B"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "LLaVA-NeXT/LICENSE", "lmms-eval/LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers @ https://github.com/huggingface/transformers/archive/1c39974a4c4036fd641bc1191cc32799f85715a4.zip",
    "tokenizers==0.15.2",
    "accelerate==1.13.0",
    "peft==0.10.0",
    "numpy==1.26.4",
    "datasets==2.16.1",
    "pyarrow==24.0.0",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "pillow==12.2.0",
    "pyyaml==6.0.3",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "ftfy==6.3.1",
    "shortuuid==1.0.13",
    "huggingface-hub==0.36.2",
    "safetensors==0.7.0",
    "requests==2.33.1",
    "packaging==26.0",
    "tqdm==4.67.3",
    "typing-extensions==4.15.0",
]

[project.optional-dependencies]
train = [
    "deepspeed==0.14.4",
    "bitsandbytes==0.49.2",
    "ninja==1.13.0",
    "wandb==0.26.1",
    "tyro==1.0.13",
]
eval = [
    "loguru==0.7.3",
    "evaluate==0.4.6",
    "jsonlines==4.0.0",
    "pytablewriter==1.2.1",
    "sacrebleu==2.6.0",
    "nltk==3.9.4",
    "pycocoevalcap==1.2",
    "tqdm-multiprocess==0.0.11",
    "transformers-stream-generator==0.0.5",
    "zstandard==0.25.0",
    "tenacity==9.1.4",
    "tiktoken==0.12.0",
    "zss==1.2.0",
    "python-dotenv==1.2.2",
    "math-verify==0.9.0",
    "numexpr==2.14.1",
    "openai==2.34.0",
    "pybind11==3.0.4",
    "yt-dlp==2026.3.17",
    "openpyxl==3.1.5",
    "pydantic==1.10.8",
    "aiohttp==3.13.5",
    "jinja2==3.1.6",
    "filelock==3.29.0",
    "av==17.0.1",
    "torchaudio==2.7.0",
    "opencv-python-headless==4.11.0.86",
]
video = [
    "av==17.0.1",
    "decord==0.6.0",
    "torchaudio==2.7.0",
    "opencv-python-headless==4.11.0.86",
]
flash = [
    "flash-attn==2.8.3",
]
build = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/EIT-NLP/MWOP"
Repository = "https://github.com/EIT-NLP/MWOP"
Paper = "https://arxiv.org/abs/2610.01434"
"Bug Tracker" = "https://github.com/EIT-NLP/MWOP/issues"

[project.scripts]
lmms-eval = "lmms_eval.cli.dispatch:main"

[tool.setuptools.package-dir]
llava = "LLaVA-NeXT/llava"
trl = "LLaVA-NeXT/trl"
lmms_eval = "lmms-eval/lmms_eval"

[tool.setuptools.packages.find]
where = ["LLaVA-NeXT", "lmms-eval"]
include = ["llava*", "trl*", "lmms_eval*"]
namespaces = true

[tool.setuptools.package-data]
lmms_eval = ["**/*.yaml", "**/*.yml", "**/*_yaml", "**/*.json", "**/*.txt"]

[tool.mwop.runtime]
python = "3.10.20"
platform = "Linux x86_64"
torch-build = "2.7.0+cu128"
cuda-build = "12.8"
